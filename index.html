<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- index.html onbelleklenmesin; eski kopya kalirsa eski kod calisir (kesin cozum: sunucu Cache-Control: no-cache). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="İşletme profili — iletişim bilgileri ve gönderiler.">
  <title>İşletme Profili</title>

  <!-- Cache-busting: CSS/JS ?v= ile istenir. Her dagitimda bu surumu artir;
       yoksa tarayici eski kopyayi tutar ve degisiklik gorunmez. -->
  <script>
    window.ASSET_VERSION = '1.0';
    // Kayitli tema tercihini CSS'ten ONCE uygula (flash yok); tercih yoksa sistem temasi.
    try { var savedTheme = localStorage.getItem('theme'); if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme); } catch (e) {}
    (function () {
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'assets/css/custom.css?v=' + window.ASSET_VERSION;
      document.head.appendChild(css);
    })();
  </script>
</head>
<body>

  <main class="container">
    <header class="profile-header" id="header"></header>
    <section class="contact" id="contact" aria-label="İletişim bilgileri"></section>
    <nav class="tabs" id="tabs" aria-label="Bölümler"></nav>
    <section class="catalog" id="catalog" aria-label="Katalog" hidden></section>
    <section class="grid" id="grid" aria-label="Gönderiler"></section>
    <div id="sentinel" aria-hidden="true"></div>
    <section class="faq" id="faq" aria-label="Sık sorulan sorular" hidden></section>
    <footer class="site-footer">© 2026 <span id="footerName"></span></footer>
  </main>

  <div id="layers"></div>

  <script>
    (function () {
      var v = window.ASSET_VERSION;
      ['data/profile.js', 'assets/js/icons.js', 'assets/js/app.js'].forEach(function (src) {
        var script = document.createElement('script');
        script.src = src + '?v=' + v;
        script.async = false;   // yukleme sirasini koru: veri -> ikonlar -> uygulama
        document.head.appendChild(script);
      });
    })();
  </script>
</body>
</html>
